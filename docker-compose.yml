# ============================================================
# POSMoon - Stack para Dokploy (y desarrollo local)
#
# En Dokploy: tipo "Compose", Compose Path ./docker-compose.yml
# Variables obligatorias en la pestania Environment:
#   APP_KEY, APP_URL, DB_PASSWORD, DB_ROOT_PASSWORD, REDIS_PASSWORD
# Generar APP_KEY:  echo "base64:$(openssl rand -base64 32)"
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - default
      - dokploy-network
    environment: &app-env
      APP_NAME: ${APP_NAME:-POSMoon}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?Falta APP_KEY en Environment de Dokploy}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Argentina/Buenos_Aires}
      TZ: ${APP_TIMEZONE:-America/Argentina/Buenos_Aires}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-cmoon}
      DB_USERNAME: ${DB_USERNAME:-cmoon}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en Environment de Dokploy}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Falta REDIS_PASSWORD en Environment de Dokploy}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stderr
      APP_LOCALE: es
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTORUN_ENABLED: "true"   # corre migraciones y cachea config al iniciar
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage/app

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--timeout=90"]
    stop_signal: SIGTERM
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "false"
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 10s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage/app

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "false"
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage/app

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cmoon}
      MYSQL_USER: ${DB_USERNAME:-cmoon}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en Environment de Dokploy}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD en Environment de Dokploy}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Falta REDIS_PASSWORD en Environment de Dokploy}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Adminer - Admin de base de datos vía web (opcional, deshabilitar en producción si no se usa)
  adminer:
    image: adminer:4
    restart: unless-stopped
    networks:
      - default
      - dokploy-network
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: dracula
    depends_on:
      mysql:
        condition: service_healthy

  # One-shot: carga dump legacy + ETL (solo si LEGACY_AUTO_MIGRATE=true)
  data-migrator:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "false"
      LEGACY_IMPORT_ENABLED: ${LEGACY_IMPORT_ENABLED:-false}
      LEGACY_DUMP_URL: ${LEGACY_DUMP_URL:-}
      LEGACY_DB_HOST: ${LEGACY_DB_HOST:-mysql}
      LEGACY_DB_PORT: ${LEGACY_DB_PORT:-3306}
      LEGACY_DB_DATABASE: ${LEGACY_DB_DATABASE:-jamrod_legacy}
      LEGACY_DB_USERNAME: ${LEGACY_DB_USERNAME:-root}
      LEGACY_DB_PASSWORD: ${LEGACY_DB_PASSWORD:-}
      LEGACY_AUTO_MIGRATE: ${LEGACY_AUTO_MIGRATE:-false}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -euo pipefail
        cd /var/www/html
        if [ "${LEGACY_AUTO_MIGRATE:-false}" != "true" ]; then
          echo "LEGACY_AUTO_MIGRATE!=true → skip migrator"
          exit 0
        fi
        if [ -f storage/app/legacy-migrate.done ]; then
          echo "legacy-migrate.done existe → skip"
          exit 0
        fi
        export LEGACY_DB_PASSWORD="$${LEGACY_DB_PASSWORD:-$$DB_ROOT_PASSWORD}"
        echo "==> legacy:load-dump"
        php artisan legacy:load-dump --database="$${LEGACY_DB_DATABASE}"
        echo "==> legacy:import --create-empresa"
        php artisan legacy:import --create-empresa
        date -u +"completed %Y-%m-%dT%H:%M:%SZ" > storage/app/legacy-migrate.done
        echo "==> migración legacy finalizada"
    volumes:
      - app-storage:/var/www/html/storage/app

volumes:
  app-storage:
  mysql-data:
  redis-data:

networks:
  # Red de Traefik en Dokploy. Crear en local con:
  #   docker network create dokploy-network
  dokploy-network:
    external: true
