<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSMoon Offline</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <div>
            <strong id="empresa">POSMoon</strong>
            <span id="sucursal" class="badge"></span>
        </div>
        <div class="status-row">
            <span id="online" class="pill ok">En línea</span>
            <span id="license-msg" class="pill warn" hidden></span>
            <span id="pending" class="pill warn" hidden></span>
            <button type="button" id="btn-sync" class="btn-sm">Sincronizar</button>
        </div>
    </header>

    <div id="blocked" class="blocked" hidden>
        <h2>Sistema suspendido</h2>
        <p id="blocked-msg"></p>
        <button type="button" id="btn-retry-license">Reintentar conexión</button>
    </div>

    <main id="pos" class="pos-grid">
        <section class="panel left-panel">
            <div class="toolbar">
                <label class="cliente-wrap">Cliente
                    <select id="cliente">
                        <option value="">Consumidor final</option>
                    </select>
                </label>
                <p id="lista-label" class="lista-label" hidden></p>
            </div>
            <input type="text" id="buscar" class="search"
                   placeholder="Código, 2*codigo, nombre… o escanear (Enter)" autofocus>
            <div id="sugerencias" class="suggestions"></div>
            <p class="hint">Atajos: Enter agrega · F12 cobra · cantidad decimal 0,080 · 2*codigo multiplica</p>
        </section>

        <section class="panel cart-panel">
            <h2>Carrito</h2>
            <div id="carrito" class="cart-items"></div>
            <div class="totals">
                <div class="total-line muted-line"><span>Subtotal</span><span id="subtotal">$ 0,00</span></div>
                <label class="desc-line">Lista de precios
                    <select id="lista-precio"></select>
                </label>
                <div class="desc-line desc-dual">
                    <label>Desc. %
                        <input type="text" id="descuento-pct" inputmode="decimal" value="0">
                    </label>
                    <label>Desc. $
                        <input type="text" id="descuento" inputmode="decimal" value="0">
                    </label>
                </div>
                <div class="quick-disc" id="quick-disc">
                    <button type="button" data-pct="5">5%</button>
                    <button type="button" data-pct="10">10%</button>
                    <button type="button" data-pct="15">15%</button>
                    <button type="button" data-pct="20">20%</button>
                </div>
                <div class="total-line"><span>Total</span><strong id="total">$ 0,00</strong></div>
            </div>
            <div class="actions">
                <button type="button" id="btn-vaciar" class="btn-secondary">Vaciar</button>
                <button type="button" id="btn-cobrar" class="btn-primary" disabled>Cobrar (F12)</button>
            </div>
        </section>
    </main>

    <dialog id="modal-pago">
        <form method="dialog" id="form-pago">
            <h3>Cobro</h3>
            <p>Total: <strong id="pago-total"></strong></p>
            <label>Medio de pago
                <select id="medio"></select>
            </label>
            <p id="recargo-info" class="muted" hidden></p>
            <label>Importe recibido
                <input type="text" id="importe" inputmode="decimal">
            </label>
            <p id="vuelto" class="muted" hidden></p>
            <p id="pago-error" class="error" hidden></p>
            <div class="dialog-actions">
                <button type="button" id="cancel-pago">Cancelar</button>
                <button type="submit" id="confirm-pago">Confirmar venta</button>
            </div>
        </form>
    </dialog>

    <dialog id="modal-importe">
        <form method="dialog" id="form-importe">
            <h3>Ingresá el importe</h3>
            <p id="importe-producto" class="muted"></p>
            <p class="muted" style="color:#b45309">Este producto no tiene precio de lista.</p>
            <label>Importe unitario ($)
                <input type="number" id="importe-precio" step="0.01" min="0.01" required>
            </label>
            <p id="importe-error" class="error" hidden></p>
            <div class="dialog-actions">
                <button type="button" id="cancel-importe">Cancelar</button>
                <button type="submit">Agregar</button>
            </div>
        </form>
    </dialog>

    <dialog id="modal-ok">
        <h3 id="ok-title">Venta registrada</h3>
        <p id="ok-msg"></p>
        <button type="button" id="ok-close">Continuar</button>
    </dialog>

    <script src="pos.js"></script>
</body>
</html>
