; Hardening PHP (php.net Oct 2026 + plan POSMoon).
; No deshabilitar proc_open/proc_close: Symfony Process y las colas lo usan.

expose_php = Off
display_errors = Off
display_startup_errors = Off
allow_url_include = Off
allow_url_fopen = On

session.upload_progress.enabled = 0
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1

post_max_size = 32M
upload_max_filesize = 16M
max_execution_time = 90
max_input_time = 60
max_input_vars = 2000

disable_functions = exec,passthru,shell_exec,system,dl
